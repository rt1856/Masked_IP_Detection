<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masked IP Detection Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .stat-number {
            font-size: 3em;
            font-weight: bold;
            color: #667eea;
            margin: 10px 0;
        }

        .stat-label {
            color: #888;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .check-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }

        .result.masked {
            background: #fee;
            border-left: 5px solid #e53e3e;
        }

        .result.legitimate {
            background: #efe;
            border-left: 5px solid #38a169;
        }

        .result-header {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .result-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .detail-item {
            background: white;
            padding: 10px;
            border-radius: 5px;
        }

        .detail-label {
            font-size: 0.8em;
            color: #888;
            text-transform: uppercase;
        }

        .detail-value {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-top: 5px;
        }

        .risk-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
        }

        .risk-low { background: #c6f6d5; color: #22543d; }
        .risk-medium { background: #feebc8; color: #7c2d12; }
        .risk-high { background: #fed7d7; color: #742a2a; }
        .risk-critical { background: #feb2b2; color: #63171b; }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .recent-checks {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .recent-item {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .recent-item:last-child {
            border-bottom: none;
        }

        .recent-ip {
            font-family: monospace;
            font-weight: bold;
        }

        .recent-time {
            color: #888;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛡️ Masked IP Detection Dashboard</h1>
            <p class="subtitle">Real-time ML-powered IP analysis for Web Application Firewall</p>
        </header>

        <div class="grid">
            <div class="card">
                <h2>Total Checks</h2>
                <div class="stat-number" id="totalChecks">0</div>
                <div class="stat-label">IPs Analyzed</div>
            </div>

            <div class="card">
                <h2>Masked IPs Detected</h2>
                <div class="stat-number" id="maskedCount" style="color: #e53e3e;">0</div>
                <div class="stat-label">Suspicious IPs</div>
            </div>

            <div class="card">
                <h2>Detection Rate</h2>
                <div class="stat-number" id="detectionRate">0%</div>
                <div class="stat-label">Accuracy</div>
            </div>

            <div class="card">
                <h2>System Status</h2>
                <div class="stat-number" id="systemStatus" style="font-size: 2em;">✅</div>
                <div class="stat-label">Operational</div>
            </div>
        </div>

        <div class="check-section">
            <h2>Check IP Address</h2>
            <div class="input-group">
                <input type="text" id="ipInput" placeholder="Enter IP address (e.g., 8.8.8.8)" />
                <button onclick="checkIP()">Analyze IP</button>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Analyzing IP address...</p>
            </div>

            <div class="result" id="result"></div>
        </div>

        <div class="recent-checks">
            <h2>Recent Checks</h2>
            <div id="recentChecks">
                <p style="text-align: center; color: #888;">No recent checks</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        let recentChecks = [];

        // Load statistics on page load
        window.addEventListener('load', () => {
            loadStats();
            loadRecentChecks();
        });

        async function loadStats() {
            try {
                const response = await fetch(`${API_URL}/api/v1/stats`);
                const data = await response.json();
                
                document.getElementById('systemStatus').innerHTML = '✅';
                
                // Update stats (these would come from your backend)
                const totalChecks = recentChecks.length;
                const maskedCount = recentChecks.filter(c => c.is_masked).length;
                
                document.getElementById('totalChecks').textContent = totalChecks;
                document.getElementById('maskedCount').textContent = maskedCount;
                
                const rate = totalChecks > 0 ? ((maskedCount / totalChecks) * 100).toFixed(1) : 0;
                document.getElementById('detectionRate').textContent = rate + '%';
                
            } catch (error) {
                console.error('Error loading stats:', error);
                document.getElementById('systemStatus').innerHTML = '❌';
            }
        }

        async function checkIP() {
            const ipInput = document.getElementById('ipInput');
            const ip = ipInput.value.trim();
            
            if (!ip) {
                alert('Please enter an IP address');
                return;
            }

            // Show loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';

            try {
                const response = await fetch(`${API_URL}/api/v1/check`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        ip_address: ip,
                        include_details: true
                    })
                });

                const data = await response.json();
                
                displayResult(data);
                
                // Add to recent checks
                recentChecks.unshift({
                    ip: ip,
                    is_masked: data.is_masked,
                    timestamp: new Date()
                });
                if (recentChecks.length > 10) recentChecks.pop();
                
                loadRecentChecks();
                loadStats();
                
            } catch (error) {
                alert('Error checking IP: ' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function displayResult(data) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = 'result ' + (data.is_masked ? 'masked' : 'legitimate');
            resultDiv.style.display = 'block';

            const riskClass = 'risk-' + data.risk_level.toLowerCase();
            
            resultDiv.innerHTML = `
                <div class="result-header">
                    ${data.is_masked ? '⚠️ Masked IP Detected' : '✅ Legitimate IP'}
                </div>
                <div class="result-details">
                    <div class="detail-item">
                        <div class="detail-label">IP Address</div>
                        <div class="detail-value">${data.ip_address}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Confidence</div>
                        <div class="detail-value">${(data.confidence * 100).toFixed(1)}%</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Risk Level</div>
                        <div class="detail-value">
                            <span class="risk-badge ${riskClass}">${data.risk_level}</span>
                        </div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Type</div>
                        <div class="detail-value">${data.detected_type || 'N/A'}</div>
                    </div>
                </div>
            `;
        }

        function loadRecentChecks() {
            const container = document.getElementById('recentChecks');
            
            if (recentChecks.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #888;">No recent checks</p>';
                return;
            }

            container.innerHTML = recentChecks.map(check => `
                <div class="recent-item">
                    <span class="recent-ip">${check.ip}</span>
                    <span>${check.is_masked ? '🔴 Masked' : '🟢 Legitimate'}</span>
                    <span class="recent-time">${formatTime(check.timestamp)}</span>
                </div>
            `).join('');
        }

        function formatTime(date) {
            const now = new Date();
            const diff = Math.floor((now - date) / 1000);
            
            if (diff < 60) return 'Just now';
            if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
            if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
            return Math.floor(diff / 86400) + 'd ago';
        }

        // Allow Enter key to submit
        document.getElementById('ipInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkIP();
        });
    </script>
</body>
</html>
